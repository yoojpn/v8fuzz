# /etc/systemd/system/budget-guard.service
[Unit]
Description=v8fuzz budget guard - auto delete Droplets on low credit

[Service]
Type=oneshot
User=root
Environment=DO_TOKEN=YOUR_DO_TOKEN
Environment=RESEND_API_KEY=YOUR_RESEND_KEY
Environment=ALERT_EMAIL=your@gmail.com
Environment=SAFE_THRESHOLD=20
ExecStart=/opt/v8fuzz/venv/bin/python /opt/v8fuzz/app/scripts/budget_guard.py
StandardOutput=append:/opt/v8fuzz/logs/budget_guard.log
StandardError=append:/opt/v8fuzz/logs/budget_guard.log

---

# /etc/systemd/system/budget-guard.timer
[Unit]
Description=Run budget guard every hour

[Timer]
OnBootSec=5min
OnUnitActiveSec=1h
Persistent=true

[Install]
WantedBy=timers.target
