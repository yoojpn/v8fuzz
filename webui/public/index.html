<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>v8fuzz / dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080a0e;
    --surface: #0d1117;
    --border: #1c2230;
    --accent: #00ff88;
    --accent2: #ff3c6e;
    --accent3: #3c8eff;
    --text: #e2e8f0;
    --muted: #4a5568;
    --critical: #ff3c6e;
    --high: #ff8c42;
    --medium: #ffd166;
    --low: #06d6a0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }
  header {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    background: rgba(8,10,14,0.9);
    backdrop-filter: blur(12px);
  }
  .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 8px var(--accent);
    animation: pulse 2s infinite; display: inline-block; margin-right: 8px;
  }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
  .header-right { display: flex; align-items: center; gap: 24px; font-size: 12px; color: var(--muted); }
  .live-badge {
    background: rgba(0,255,136,0.1); border: 1px solid rgba(0,255,136,0.3);
    color: var(--accent); padding: 4px 10px; border-radius: 4px;
    font-size: 11px; font-weight: 700; letter-spacing: 1px;
  }
  main { position: relative; z-index: 1; padding: 32px; max-width: 1400px; margin: 0 auto; }
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
  .kpi {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 20px 24px; position: relative; overflow: hidden; transition: border-color 0.2s;
  }
  .kpi:hover { border-color: var(--accent); }
  .kpi::after { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:var(--accent); opacity:0.6; }
  .kpi.red::after { background: var(--accent2); }
  .kpi.blue::after { background: var(--accent3); }
  .kpi.orange::after { background: var(--high); }
  .kpi-label { font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; }
  .kpi-value { font-family: 'Syne', sans-serif; font-size: 36px; font-weight: 800; line-height: 1; }
  .kpi-sub { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .grid2 { display: grid; grid-template-columns: 1fr 380px; gap: 20px; margin-bottom: 20px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted);
  }
  .panel-header span { color: var(--accent); font-size: 10px; }
  .crash-row {
    display: grid; grid-template-columns: 80px 100px 1fr 80px 70px 90px;
    align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--border);
    font-size: 12px; transition: background 0.15s; cursor: pointer;
  }
  .crash-row:hover { background: rgba(255,255,255,0.03); }
  .crash-row.header { font-size:10px; letter-spacing:1px; color:var(--muted); cursor:default; }
  .crash-row.header:hover { background: transparent; }
  .sev { display:inline-block; padding:2px 8px; border-radius:3px; font-size:10px; font-weight:700; letter-spacing:1px; }
  .sev.CRITICAL { background:rgba(255,60,110,0.15); color:var(--critical); border:1px solid rgba(255,60,110,0.3); }
  .sev.HIGH     { background:rgba(255,140,66,0.15); color:var(--high);     border:1px solid rgba(255,140,66,0.3); }
  .sev.MEDIUM   { background:rgba(255,209,102,0.15);color:var(--medium);   border:1px solid rgba(255,209,102,0.3);}
  .sev.LOW      { background:rgba(6,214,160,0.15);  color:var(--low);      border:1px solid rgba(6,214,160,0.3); }
  .crash-id { color:var(--accent); font-size:11px; }
  .crash-type { color:var(--accent3); }
  .crash-title { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding-right:12px; }
  .cvss-val { font-weight:700; }
  .engine-badge { font-size:10px; padding:2px 6px; border-radius:3px; background:rgba(60,142,255,0.1); color:var(--accent3); border:1px solid rgba(60,142,255,0.2); }
  .log-feed { padding:12px 0; height:320px; overflow-y:auto; }
  .log-feed::-webkit-scrollbar { width:4px; }
  .log-feed::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
  .log-entry { display:flex; gap:12px; padding:6px 20px; font-size:11px; line-height:1.5; border-left:2px solid transparent; }
  .log-entry.crash { border-left-color:var(--accent2); }
  .log-entry.info  { border-left-color:var(--accent3); }
  .log-entry.warn  { border-left-color:var(--high); }
  .log-time { color:var(--muted); flex-shrink:0; width:60px; }
  .stats-row { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
  .mini-stat { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:16px 20px; display:flex; align-items:center; justify-content:space-between; }
  .mini-label { font-size:11px; color:var(--muted); }
  .mini-val { font-family:'Syne',sans-serif; font-size:22px; font-weight:700; }
  .empty { padding:48px 20px; text-align:center; color:var(--muted); font-size:12px; }
  .empty-icon { font-size:32px; margin-bottom:12px; opacity:0.4; }
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:100; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
  .modal-overlay.open { display:flex; }
  .modal { background:var(--surface); border:1px solid var(--border); border-radius:12px; width:90%; max-width:720px; max-height:80vh; overflow-y:auto; padding:28px; }
  .modal-title { font-family:'Syne',sans-serif; font-size:20px; font-weight:700; margin-bottom:20px; color:var(--accent); }
  .modal-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
  .modal-field label { font-size:10px; letter-spacing:1.5px; color:var(--muted); text-transform:uppercase; display:block; margin-bottom:4px; }
  .modal-field p { font-size:13px; }
  .poc-block { background:#0a0e14; border:1px solid var(--border); border-radius:6px; padding:16px; margin-top:12px; }
  .poc-block pre { font-size:12px; color:var(--accent); white-space:pre-wrap; word-break:break-all; line-height:1.6; }
  .modal-close { background:transparent; border:1px solid var(--border); color:var(--muted); padding:8px 16px; border-radius:4px; cursor:pointer; font-family:'JetBrains Mono',monospace; font-size:12px; margin-top:20px; transition:all 0.2s; }
  .modal-close:hover { border-color:var(--accent2); color:var(--accent2); }
  @media (max-width:900px) {
    .kpi-grid { grid-template-columns:repeat(2,1fr); }
    .grid2 { grid-template-columns:1fr; }
    .crash-row { grid-template-columns:70px 90px 1fr 60px; }
    .crash-row > :nth-child(5), .crash-row > :nth-child(6) { display:none; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">v8<span>fuzz</span></div>
  <div class="header-right">
    <span id="last-update">—</span>
    <span class="live-badge"><span class="status-dot"></span>LIVE</span>
  </div>
</header>
<main>
  <div class="kpi-grid">
    <div class="kpi">
      <div class="kpi-label">Total Executions</div>
      <div class="kpi-value" id="kpi-execs">—</div>
      <div class="kpi-sub" id="kpi-execs-rate">— exec/s</div>
    </div>
    <div class="kpi red">
      <div class="kpi-label">Crashes Found</div>
      <div class="kpi-value" id="kpi-crashes">—</div>
      <div class="kpi-sub" id="kpi-crashes-sub">— unique</div>
    </div>
    <div class="kpi blue">
      <div class="kpi-label">Seeds Generated</div>
      <div class="kpi-value" id="kpi-seeds">—</div>
      <div class="kpi-sub">corpus size</div>
    </div>
    <div class="kpi orange">
      <div class="kpi-label">Uptime</div>
      <div class="kpi-value" id="kpi-uptime">—</div>
      <div class="kpi-sub" id="kpi-uptime-sub">since start</div>
    </div>
  </div>
  <div class="grid2">
    <div class="panel">
      <div class="panel-header">Crash Log <span id="crash-count">0 entries</span></div>
      <div>
        <div class="crash-row header">
          <div>ID</div><div>TYPE</div><div>TITLE</div><div>CVSS</div><div>ENGINE</div><div>SEVERITY</div>
        </div>
        <div id="crash-list">
          <div class="empty"><div class="empty-icon">🔍</div>No crashes yet</div>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-header">Live Log <span id="log-count">—</span></div>
      <div class="log-feed" id="log-feed">
        <div class="empty"><div class="empty-icon">📡</div>Waiting for events...</div>
      </div>
    </div>
  </div>
  <div class="stats-row">
    <div class="mini-stat">
      <div><div class="mini-label">API Requests Today</div><div class="mini-val" id="stat-api">—</div></div>
      <div style="font-size:28px;opacity:0.3">⚡</div>
    </div>
    <div class="mini-stat">
      <div><div class="mini-label">Active Workers</div><div class="mini-val" id="stat-workers">—</div></div>
      <div style="font-size:28px;opacity:0.3">⚙️</div>
    </div>
  </div>
</main>
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-title" id="modal-title">—</div>
    <div class="modal-grid" id="modal-grid"></div>
    <div id="modal-poc"></div>
    <button class="modal-close" onclick="closeModal()">✕ Close</button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
